name: sync

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          # secrets
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          BLACKLIST: ${{ secrets.BLACKLIST }}
          COMMENT_RULES: ${{ secrets.COMMENT_RULES }}
          GENERIC_PHRASES: ${{ secrets.GENERIC_PHRASES }}
          EXTRA_SKIP_HINTS: ${{ secrets.EXTRA_SKIP_HINTS }}
          EXTRA_KEYWORDS: ${{ secrets.EXTRA_KEYWORDS }}
          # variables
          HIVE_ACCOUNT: ${{ vars.HIVE_ACCOUNT }}
          APP_NAME: ${{ vars.APP_NAME }}
          MIN_HP: ${{ vars.MIN_HP }}
          BLOCKED_COMMUNITIES: ${{ vars.BLOCKED_COMMUNITIES }}
          SKIP_BENEFICIARIES: ${{ vars.SKIP_BENEFICIARIES }}
          SKIP_CRYPTO_POSTS: ${{ vars.SKIP_CRYPTO_POSTS }}
          KEYWORD_MIN: ${{ vars.KEYWORD_MIN }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
          UPVOTE_WEIGHT: ${{ vars.UPVOTE_WEIGHT }}
          RUN_EVERY_MIN: ${{ vars.RUN_EVERY_MIN }}
          MIN_GAP_MIN: ${{ vars.MIN_GAP_MIN }}
          JITTER_MAX_SEC: ${{ vars.JITTER_MAX_SEC }}
          COOLDOWN_DAYS: ${{ vars.COOLDOWN_DAYS }}
          MODEL: ${{ vars.MODEL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          LOG_TEXT: ${{ vars.LOG_TEXT }}
          MAX_WORDS: ${{ vars.MAX_WORDS }}
          MIN_AGE_MIN: ${{ vars.MIN_AGE_MIN }}
          GEMINI_DAILY_CAP: ${{ vars.GEMINI_DAILY_CAP }}
          GEMINI_PER_RUN: ${{ vars.GEMINI_PER_RUN }}
          GEMINI_GAP_SEC: ${{ vars.GEMINI_GAP_SEC }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
        run: python bot.py

      - name: Save encrypted state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet || (git commit -m "update state" && git push)
